[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-sign-quantization-robustness"
version = "0.1.0"
description = "Traffic sign model training and quantization experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "torch>=2.2", "torchvision>=0.17"]

[project.scripts]
traffic-sign-benchmark-pair = "traffic_sign_quantization.benchmark_pair_cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["traffic_sign_quantization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
