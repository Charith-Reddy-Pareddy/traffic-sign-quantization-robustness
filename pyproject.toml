[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-sign-quantization-robustness"
version = "0.1.0"
description = "Traffic sign model training and quantization experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["traffic_sign_quantization*"]
